# Production stack: API (NestJS) + PostgreSQL + Caddy (automatic HTTPS).
# Run from the deploy/ folder: docker compose -f docker-compose.prod.yml up -d --build
# Secrets live in deploy/.env (never committed, see .env.example).

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: auberge
      POSTGRES_USER: auberge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auberge -d auberge"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No ports: the database is only reachable from the API container

  api:
    build: ../Backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://auberge:${POSTGRES_PASSWORD}@db:5432/auberge?schema=public
    volumes:
      # Room images uploaded from the admin; seeded with the images baked into the image
      - uploads:/app/public/rooms
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
